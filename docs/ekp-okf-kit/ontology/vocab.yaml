# Controlled vocabularies for the ekp-core aspect. The build gate rejects
# any value not listed here. Grow these by pull request, not inside a build.
vocab_version: "1.0"

domains:
  - departure-control
  - order-management
  - inventory
  - platform-ops

source_kinds:
  # source_kind -> source systems it may arrive from
  registry: [git]
  code:     [git]
  arch_doc: [git, confluence, sharepoint]
  brd:      [git, confluence, sharepoint]
  wiki:     [confluence]
  jira:     [jira]

# Module languages. Any repo kind in the enterprise; add by pull request.
languages: [java, kotlin, scala, typescript, javascript, python, go, csharp, cpp, c, rust,
            tpf-c, hlasm, cobol, pl1, sql, shell, other]

trust_tiers: [unverified, machine_confirmed, human_reviewed]

# How the concept's content was produced. Drives the trust policy:
# llm-extracted content must be draft until something verifies it.
extraction_methods: [deterministic, template, llm, human]

lifecycle: [draft, stable, deprecated]

patterns:
  owner_team: '^team:[a-z0-9-]+$'
  build_id:   '^[a-z0-9][a-z0-9-]*-\d{8}T\d{6}Z$'
