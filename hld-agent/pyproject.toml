[project]
name = "hld-agent"
version = "0.1.0"
description = "LangGraph agent that authors High-Level Design documents in AsciiDoc from a requirement, grounded in a knowledge base via MCP."
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "langchain>=1.0",            # init_chat_model
  "langchain-core>=1.0",
  "pydantic>=2.7",
  "pyyaml>=6",
  "rank-bm25>=0.2.2",
  "mcp>=1.20",
]

[project.optional-dependencies]
gemini = ["langchain-google-genai>=3.0"]     # model: google_genai:gemini-2.5-pro
vertex = ["langchain-google-vertexai>=3.0"]  # model: google_vertexai:gemini-2.5-pro
anthropic = ["langchain-anthropic>=1.0"]     # model: anthropic:claude-sonnet-4-5
dev = ["pytest>=8"]

[project.scripts]
hld-agent = "hld_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hld_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
